<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1765d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rep Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a phone gym log. Workout days wear the colours of competition weight plates. */
:root{
  --bg:#edf0f4;--surface:#ffffff;--surface-2:#e4e9ef;--ink:#131821;--ink-2:#465061;--ink-3:#667080;--line:#d5dbe3;
  --push:#d8232f;--pull:#1769e0;--legs:#107f45;--arms:#d39200;--full:#6a4fd8;
  --push-fill:#c81e2b;--pull-fill:#1765d6;--legs-fill:#0f7d44;--arms-fill:#e3a30a;--full-fill:#5f45cf;
  --on-fill:#ffffff;--on-arms:#131821;
  --good:#0ca30c;--warn:#fab219;--bad:#d03b3b;--good-ink:#067a06;--warn-ink:#8a5b00;--bad-ink:#b92c2c;
  --k-class:#51627a;--k-study:#0b8585;--k-meal:#d9650f;--k-sleep:#4b3fb0;--k-commute:#8a94a3;--k-exam:#c2185b;
  --accent:#1769e0;--band:#d9e6f8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a;--surface:#191f29;--surface-2:#242c38;--ink:#eef2f7;--ink-2:#b6c0ce;--ink-3:#8f99a8;--line:#2d3644;
  --push:#e66767;--pull:#3987e5;--legs:#199e70;--arms:#c98500;--full:#8f82e8;
  --good:#0ca30c;--warn:#fab219;--bad:#d03b3b;--good-ink:#49c949;--warn-ink:#fac14b;--bad-ink:#f07b7b;
  --k-class:#7186a3;--k-study:#2aa9a9;--k-meal:#ec8a3f;--k-sleep:#8b80ea;--k-commute:#7f8998;--k-exam:#ec5c94;
  --accent:#5b9bf5;--band:#22344e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a;--surface:#191f29;--surface-2:#242c38;--ink:#eef2f7;--ink-2:#b6c0ce;--ink-3:#8f99a8;--line:#2d3644;
  --push:#e66767;--pull:#3987e5;--legs:#199e70;--arms:#c98500;--full:#8f82e8;
  --good:#0ca30c;--warn:#fab219;--bad:#d03b3b;--good-ink:#49c949;--warn-ink:#fac14b;--bad-ink:#f07b7b;
  --k-class:#7186a3;--k-study:#2aa9a9;--k-meal:#ec8a3f;--k-sleep:#8b80ea;--k-commute:#7f8998;--k-exam:#ec5c94;
  --accent:#5b9bf5;--band:#22344e;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.42 var(--body);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font:700 2.1rem/1 var(--display);letter-spacing:.01em;text-wrap:balance}
h2{font:700 1.45rem/1.1 var(--display);letter-spacing:.015em;text-wrap:balance}
h3{font:600 1.05rem/1.2 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sync{font-size:.74rem;color:var(--ink-3);margin-top:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plain{font-size:.93rem;color:var(--ink-2)}
.small{font-size:.83rem;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wraprow{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f131a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f131a}}
.btn.full{width:100%}
.btn.thin{min-height:38px;padding:0 13px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:40px;padding:0 13px;border-radius:999px;background:var(--surface-2);font-weight:500;font-size:.93rem}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.flabel{font-size:.86rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;min-height:44px;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:8px 11px;min-width:0}
textarea{resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{background:var(--band);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.banner b{font-weight:700}

/* Readiness */
.gaugewrap{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.gaugewrap svg{width:100%;height:auto;display:block}
.status{display:inline-flex;align-items:center;gap:6px;font:700 1.4rem/1 var(--display);letter-spacing:.015em}
.status i{width:12px;height:12px;border-radius:50%;display:block;flex:none}
.factor{display:grid;grid-template-columns:92px 1fr 30px;gap:9px;align-items:center;font-size:.85rem}
.factor .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.factor .fill{height:100%;border-radius:4px}
.factor b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.factors{display:flex;flex-direction:column;gap:7px}

/* Workout card */
.day-card{border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:11px;color:var(--on-fill);min-width:0}
.t-push{background:var(--push-fill)}.t-pull{background:var(--pull-fill)}.t-legs{background:var(--legs-fill)}.t-arms{background:var(--arms-fill);color:var(--on-arms)}.t-full{background:var(--full-fill)}.t-recover{background:var(--k-sleep);color:#fff}.t-rest{background:var(--surface);color:var(--ink)}
.day-card h2{font-size:2.6rem;line-height:.95;text-transform:uppercase}
.day-card .meta{font-size:.95rem;font-weight:500}
.day-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.95rem}
.day-card li{display:flex;justify-content:space-between;gap:10px}
.day-card li span:last-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.day-card .btn{background:rgba(255,255,255,.22);color:inherit}
.day-card.t-arms .btn{background:rgba(19,24,33,.14)}
.day-card .btn.go{background:#fff;color:#131821}
.day-card.t-arms .btn.go{background:#131821;color:#fff}
.day-card.t-rest .btn{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.22)}
.t-arms .pill{background:rgba(19,24,33,.14)}
.btnrow{display:grid;grid-template-columns:2fr 1fr;gap:8px}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:46px 8px 1fr 34px;gap:10px;align-items:stretch;min-height:46px}
.tl-time{font-size:.83rem;font-weight:600;color:var(--ink-2);padding-top:7px;font-variant-numeric:tabular-nums}
.tl-bar{border-radius:4px;margin-block:3px}
.tl-body{padding-block:5px;min-width:0}
.tl-body b{font-weight:600;display:block;overflow-wrap:anywhere}
.tl-body span{font-size:.82rem;color:var(--ink-3);display:block;overflow-wrap:anywhere}
.tl-row.done .tl-body b{text-decoration:line-through;color:var(--ink-3)}
.tl-row.now .tl-time{color:var(--accent)}
.tick-s{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);margin-top:6px;display:grid;place-items:center;color:transparent;font-size:.85rem;font-weight:700}
.tl-row.done .tick-s{background:var(--good);border-color:var(--good);color:#fff}

/* Session */
.progressbar{height:8px;background:rgba(255,255,255,.28);border-radius:4px;overflow:hidden}
.t-arms .progressbar{background:rgba(19,24,33,.16)}
.progressbar div{height:100%;background:currentColor;border-radius:4px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mtag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.target{border-radius:12px;background:var(--surface-2);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.target strong{font:700 1.5rem/1.05 var(--display);letter-spacing:.01em}
.target .why{font-size:.87rem;color:var(--ink-2)}
.tag-up{color:var(--good-ink)}.tag-hold{color:var(--warn-ink)}.tag-down{color:var(--bad-ink)}
.plates{display:flex;align-items:center;gap:10px}
.plates svg{height:44px;width:auto;flex:none;max-width:60%}
.sethead,.setrow{display:grid;grid-template-columns:18px minmax(0,1.25fr) minmax(0,1fr) 44px;gap:7px;align-items:center}
.sethead{font-size:.74rem;font-weight:600;color:var(--ink-3);text-align:center}
.setn{font-weight:700;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;background:var(--surface-2);border-radius:10px;align-items:center;min-width:0}
.stepper button{height:44px;font-size:1.25rem;font-weight:500;color:var(--ink-2)}
.stepper input{width:100%;min-width:0;height:44px;min-height:44px;padding:0;background:transparent;text-align:center;font-weight:700;border:0;font-variant-numeric:tabular-nums}
.tick{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:1.1rem;color:var(--ink-3)}
.setrow.done .tick{background:var(--good);color:#fff}
.setrow.done .stepper{opacity:.72}
.sets{display:flex;flex-direction:column;gap:7px}
.bwcell{height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--ink-3)}
.effort{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.effort .chip{border-radius:10px;padding:0 4px}
.linkbtn{font-size:.86rem;font-weight:600;color:var(--accent);min-height:32px}

/* Rest timer */
#timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#timer>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 8px 7px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(10,15,25,.28)}
#timer b{font:700 1.45rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:50px}
#timer button{height:34px;padding:0 11px;border-radius:999px;background:rgba(128,128,128,.32);color:inherit;font-size:.86rem;font-weight:600}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:15;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.73rem;font-weight:600;color:var(--ink-3)}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet>div{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* Week grid */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wg{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));column-gap:2px}
.wg-h{height:40px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.73rem;font-weight:600;color:var(--ink-2);line-height:1.1}
.wg-h.sel{background:var(--ink);color:var(--bg)}
.wg-h.today:not(.sel){color:var(--accent)}
.wg-col{position:relative;background:var(--surface-2);border-radius:6px;height:352px;overflow:hidden;width:100%;display:block}
.wg-axis{position:relative;height:352px}
.wg-axis span{position:absolute;left:0;font-size:.66rem;color:var(--ink-3);transform:translateY(-1px);font-variant-numeric:tabular-nums}
.wg-b{position:absolute;left:1px;right:1px;border-radius:4px;font-size:.62rem;font-weight:700;padding:1px 2px;overflow:hidden;line-height:1.1;text-align:left;color:#fff}
.wg-b.t-arms{color:var(--on-arms)}
.legend{display:flex;flex-wrap:wrap;gap:6px 13px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:block;flex:none}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line);min-width:0}
.list>div:first-child{border-top:0}
.x{width:32px;height:32px;border-radius:8px;background:var(--surface-2);color:var(--ink-3);flex:none;font-weight:700}

/* Charts */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font:500 10.5px var(--body);font-variant-numeric:tabular-nums}
.chart text.val{fill:var(--ink);font-weight:700;font-size:12px}
.grid{stroke:var(--line);stroke-width:1}
details.tbl summary{font-size:.84rem;font-weight:600;color:var(--accent);cursor:pointer;min-height:28px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink-3);font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;font-size:.92rem;color:var(--ink-2)}
.heat{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.heat div{aspect-ratio:1;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font:700 .82rem var(--display);color:#fff;max-width:100%}
.heat div.t-push{background:var(--push-fill)}.heat div.t-pull{background:var(--pull-fill)}.heat div.t-legs{background:var(--legs-fill)}.heat div.t-full{background:var(--full-fill)}.heat div.t-arms{background:var(--arms-fill);color:var(--on-arms)}
.heat div.fut{opacity:.42}
#tip{position:fixed;z-index:40;background:var(--ink);color:var(--bg);font-size:.82rem;font-weight:600;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:210px}

/* Coach */
.chat{display:flex;flex-direction:column;gap:9px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.96rem}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
:root[data-theme="dark"] .msg.me{color:#0f131a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.me{color:#0f131a}}
.msg.ai{align-self:flex-start;background:var(--surface)}
.changes{align-self:stretch;background:var(--band);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}
.changes ul{margin:0;padding-left:18px;font-size:.92rem}
.composer{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:end}
@media (prefers-reduced-motion:no-preference){.bump{animation:bump .25s ease-out}@keyframes bump{from{transform:scale(.97)}to{transform:scale(1)}}}
</style>

<script>/* Standalone runtime: gives the app the same db and AI interfaces it uses inside Claude,
   backed by a private GitHub repository and an optional Gemini key. */
(function(){
  window.STANDALONE=true;
  const KC='rep-rhythm.config',KS='rep-rhythm.store',REPO='Rico2',DEFAULT_OWNER='Rico-2002';
  const config=()=>{let c={};try{c=JSON.parse(localStorage.getItem(KC)||'{}')}catch(e){}if(!c.owner&&DEFAULT_OWNER)c.owner=DEFAULT_OWNER;return c};
  let store={docs:{},meta:{},dirty:false,rev:0};
  try{const r=JSON.parse(localStorage.getItem(KS)||'null');if(r)store={...store,...r}}catch(e){}
  const saveStore=()=>{try{localStorage.setItem(KS,JSON.stringify(store))}catch(e){}};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const decode=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
  const encode=str=>{const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
  const headers=(c,accept)=>({Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
  const url=(c,p)=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${REPO}/contents/${p}`;

  async function ghGet(c,path){
    const r=await fetch(url(c,path),{headers:headers(c),cache:'no-store'});
    if(r.status===404)return null;
    if(!r.ok)throw{status:r.status};
    const j=await r.json();
    let text=j.content?decode(j.content):'';
    if(!text){const raw=await fetch(url(c,path),{headers:headers(c,'application/vnd.github.raw+json'),cache:'no-store'});if(!raw.ok)throw{status:raw.status};text=await raw.text()}
    return{sha:j.sha,json:JSON.parse(text)};
  }
  function mergeIn(remote){
    const rd=remote.docs||{},rm=remote.meta||{};
    new Set([...Object.keys(rm),...Object.keys(store.meta)]).forEach(p=>{
      const a=store.meta[p]||0,b=rm[p]||0;
      if(b>a){store.docs[p]=rd[p]===undefined?null:rd[p];store.meta[p]=b}
      else if(a>b)store.dirty=true;
    });
    saveStore();
  }
  const FILES={'app/garmin':'garmin.json','app/feed':'timetable.json'},readOnly={};
  let syncing=null,lastSync=0,timer=null;
  async function runSync(){
    const c=config();if(!c.token||!c.owner)return false;
    for(let attempt=0;attempt<3;attempt++){
      const remote=await ghGet(c,'data.json');
      if(remote)mergeIn(remote.json);
      if(attempt===0){for(const [doc,file] of Object.entries(FILES)){try{const g=await ghGet(c,file);if(g)readOnly[doc]=g.json}catch(e){}}}
      if(!store.dirty&&remote){lastSync=Date.now();return true}
      const rev=store.rev;
      const body={message:'Update training data',content:encode(JSON.stringify({docs:store.docs,meta:store.meta}))};
      if(remote)body.sha=remote.sha;
      const r=await fetch(url(c,'data.json'),{method:'PUT',headers:{...headers(c),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){if(store.rev===rev)store.dirty=false;saveStore();lastSync=Date.now();if(store.dirty)schedule(3000);return true}
      if(r.status!==409&&r.status!==422)throw{status:r.status};
    }
    return false;
  }
  let lastErr=null;
  function sync(){if(!syncing)syncing=runSync().then(v=>{lastErr=null;return v},e=>{lastErr=e||{};throw e}).finally(()=>{syncing=null});return syncing}

function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(!r)return;Object.assign(S,r.S);S.settings={...DEFAULTS,...S.settings};Object.assign(pending,r.pending||{})}catch(e){}}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable'}),ms))])}
function persist(path,val){pending[path]=val===null?null:clone(val);lsSave();invalidate();clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),500)}
function setSync(t){const el=document.getElementById('sync');syncText=t;if(el)el.textContent=t}
let syncText='';
async function flush(path){
  if(!db||inFlight[path]||!(path in pending))return;
  inFlight[path]=true;const v=pending[path];
  try{
    await withTimeout(v===null?db.doc(path).delete():db.doc(path).set(v),15000);
    if(pending[path]===v)delete pending[path];
    setSync((window.RR&&window.RR.syncProblem())||'Saved');
  }catch(e){
    setSync(e&&e.code==='quota_exceeded'?'Storage is full. Old data needs clearing.':'Saved on this device. Will sync when back online.');
  }finally{
    inFlight[path]=false;lsSave();
    if(path in pending&&pending[path]!==v){clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),500)}
  }
}
function flushAll(){Object.keys(pending).forEach(flush)}
const save={
  settings(){persist('app/settings',S.settings)},
  timetable(){persist('app/timetable',S.timetable)},
  program(){persist('app/program',S.program)},
  schedule(){persist('app/schedule',S.schedule)},
  notes(){persist('app/notes',S.notes)},
  chat(){persist('app/chat',S.chat)},
  session(s){persist('sessions/'+s.id,s)},
  sleep(d){persist('sleep/'+d,S.sleep[d])},
  routine(d){persist('routine/'+d,S.routine[d])},
};
function sleepFor(d){const g=garminFor(d),l={...(S.sleep[d]||{}),...g};return Object.keys(g).length||S.sleep[d]?l:null}
function garminFor(d){const g=S.garmin&&S.garmin.days&&S.garmin.days[d];if(!g)return{};const o={};['sleepScore','sleepHours','bed','wake','bodyBattery','restingHR','hrv'].forEach(k=>{if(g[k]!=null&&g[k]!=='')o[k]=g[k]});return o}
function mergeGarmin(){
  S.garmin={days:{},...S.garmin};
  const t=todayKey();
  if(sleepDraft&&sleepDraft.date===t&&sleepDraft.sleepScore==null&&!S.sleep[t])Object.assign(sleepDraft,garminFor(t));
}
async function pull(){
  if(!db)return false;
  try{
    const keys=Object.keys(DOCS);
    const [docs,ses,slp,rou]=await withTimeout(Promise.all([
      Promise.all(keys.map(k=>db.doc(k).get())),
      db.collection('sessions').orderBy('date','desc').limit(500).get(),
      db.collection('sleep').orderBy('date','desc').limit(200).get(),
      db.collection('routine').orderBy('date','desc').limit(30).get(),
    ]),10000);
    docs.forEach((d,i)=>{if(d.exists&&!(keys[i] in pending))S[DOCS[keys[i]]]=clone(d.data())});
    S.settings={...DEFAULTS,...S.settings};
    S.timetable={classes:[],exams:[],...S.timetable};S.schedule={overrides:{},...S.schedule};S.notes={items:[],wishes:[],...S.notes};S.chat={turns:[],...S.chat};
    const mergeColl=(snap,name,prefix)=>{const fresh={};snap.docs.forEach(d=>{fresh[d.id]=clone(d.data())});
      Object.keys(pending).forEach(p=>{if(p.startsWith(prefix+'/')){const id=p.slice(prefix.length+1);if(pending[p]===null)delete fresh[id];else fresh[id]=pending[p]}});
      if(!snap.empty||Object.keys(fresh).length)S[name]=fresh};
    mergeColl(ses,'sessions','sessions');mergeColl(slp,'sleep','sleep');mergeColl(rou,'routine','routine');mergeGarmin();
    lsSave();invalidate();setSync((window.RR&&window.RR.syncProblem())||'Saved');return true;
  }catch(e){setSync('Showing the copy on this device.');return false}
}

/* ---------- Planner ---------- */
let weekCache={};
function invalidate(){weekCache={}}
function feedCovers(date){const f=S.feed;return !!(f&&Array.isArray(f.events)&&f.window&&date>=f.window[0]&&date<=f.window[1])}
const KIND_LABEL={lecture:'Lecture',exercise:'Supervised work',lab:'Lab',event:'Event',exam:'Exam'};
function feedOn(date){return feedCovers(date)?S.feed.events.filter(e=>e[0]===date&&!e[7]):[]}
function classesOn(date){
  const w=wdOf(date),fc=feedCovers(date);
  const manual=S.timetable.classes.filter(c=>c.day===w&&!(fc&&c.example)&&(!c.from||date>=c.from)&&(!c.until||date<=c.until));
  const fromFeed=feedOn(date).filter(e=>e[6]!=='exam').map((e,i)=>({id:'u'+date.replace(/-/g,'')+i,day:w,start:e[1],end:e[2],title:e[4],room:e[5],kind:KIND_LABEL[e[6]]||'',code:e[3]}));
  return [...fromFeed,...manual].sort((a,b)=>toM(a.start)-toM(b.start));
}
function examsOn(date){return [...S.timetable.exams.filter(e=>e.date===date),...feedOn(date).filter(e=>e[6]==='exam').map((e,i)=>({id:'ux'+i,date,title:e[4],time:e[1]}))]}
function examSeason(date){const f=S.feed;return !!(f&&(f.examPeriods||[]).some(([a,b])=>date>=addDays(a,-7)&&date<=b))}
function wakeOn(date){
  const st=S.settings;let w=toM(st.wake);
  const starts=[...classesOn(date).map(c=>toM(c.start)),...examsOn(date).filter(e=>e.time).map(e=>toM(e.time))].sort((a,b)=>a-b);
  if(starts.length){const need=starts[0]-st.commute-60;if(need<w)w=need}
  return w;
}
function bedFor(date){return wakeOn(addDays(date,1))-Math.round(S.settings.sleepH*60)-15+1440}
function dayFacts(date){
  const cl=classesOn(date),ex=examsOn(date);
  return{date,wd:wdOf(date),cl,ex,classMin:cl.reduce((a,c)=>a+toM(c.end)-toM(c.start),0),examToday:ex.length>0,examTomorrow:examsOn(addDays(date,1)).length>0,wake:wakeOn(date),bed:bedFor(date)};
}
function busyOn(f,padMin){
  const b=[...f.cl.map(c=>[toM(c.start)-padMin,toM(c.end)+padMin]),...f.ex.filter(e=>e.time).map(e=>[toM(e.time)-padMin,toM(e.time)+120+padMin])].sort((x,y)=>x[0]-y[0]);
  const out=[];b.forEach(i=>{const l=out[out.length-1];if(l&&i[0]<=l[1])l[1]=Math.max(l[1],i[1]);else out.push([...i])});
  return out;
}
function gapsIn(from,to,busy){const g=[];let c=from;busy.forEach(([s,e])=>{if(s>c)g.push([c,Math.min(s,to)]);c=Math.max(c,e)});if(c<to)g.push([c,to]);return g.filter(x=>x[1]>x[0])}
function gymSlot(f){const st=S.settings;return findSlot(f,st.sessionMin,st.gymTravel,Math.max(f.wake+60,420),Math.min(f.bed-120,1320))}
function homeSlot(f){const st=S.settings;return findSlot(f,st.homeMin,st.commute,Math.max(f.wake+30,420),Math.min(f.bed-90,1350))}
function slotFor(f){
  const st=S.settings;
  if((st.homeDays||[]).includes(f.wd)){const h=homeSlot(f);return h&&{...h,place:'home'}}
  const g=gymSlot(f);if(g)return{...g,place:'gym'};
  if(st.homeMode==='busy'){const h=homeSlot(f);if(h)return{...h,score:h.score-2,place:'home'}}
  return null;
}
function findSlot(f,len,padMin,from,to){
  const st=S.settings;
  const busy=busyOn(f,padMin);
  const lastEnd=f.cl.length?Math.max(...f.cl.map(c=>toM(c.end))):null;
  const target={morning:510,midday:750,evening:1050,auto:lastEnd!=null?lastEnd+padMin:1050}[st.pref]??1050;
  let best=null;
  gapsIn(from,to,busy).forEach(([a,b])=>{
    if(b-a<len)return;
    let s=clamp(target,a,b-len);s=Math.min(Math.ceil(s/5)*5,Math.max(a,b-len));
    const overlapsLunch=st.pref!=='midday'&&s<795&&s+len>735;
    const score=-Math.abs(s-target)/30-(overlapsLunch?3:0);
    if(!best||score>best.score)best={start:s,end:s+len,score};
  });
  return best;
}
function chooseDays(facts,slots,n){
  for(let want=n;want>0;want--){
    let best=null;
    for(let mask=0;mask<128;mask++){
      const idx=[];for(let i=0;i<7;i++)if(mask>>i&1)idx.push(i);
      if(idx.length!==want)continue;
      if(idx.some(i=>!slots[i]||facts[i].examToday))continue;
      let score=idx.reduce((a,i)=>a+10+slots[i].score-facts[i].classMin/60*.7-(facts[i].examTomorrow?4:0),0);
      let run=0;for(let i=0;i<7;i++){if(mask>>i&1){run++;if(run===3)score-=6;if(run>3)score-=18}else run=0}
      const gaps=idx.map((v,j)=>(j<idx.length-1?idx[j+1]-v:idx[0]+7-v));
      const mean=7/want;score-=gaps.reduce((a,g)=>a+(g-mean)**2,0)*1.6;
      if(!best||score>best.score)best={score,idx};
    }
    if(best)return best.idx;
  }
  return[];
}
function assignTypes(idx,facts,count){
  const list=[...(SPLITS[count]||SPLITS[4])].slice(0,Math.max(idx.length,0));
  const out={};idx.forEach((d,i)=>out[d]=list[i]);
  const legsDay=idx.find(d=>out[d]==='legs');
  if(legsDay!=null&&(facts[legsDay].examTomorrow||facts[legsDay].classMin>=420)){
    const swap=idx.filter(d=>d!==legsDay&&!facts[d].examTomorrow).sort((a,b)=>facts[a].classMin-facts[b].classMin)[0];
    if(swap!=null&&facts[swap].classMin<facts[legsDay].classMin+(facts[legsDay].examTomorrow?999:0)){out[legsDay]=out[swap];out[swap]='legs'}
  }
  return out;
}
function dayWhy(d){
  if(d.moved)return 'You moved this session here.';
  if(d.forcedRest)return 'You marked this as a rest day.';
  if(d.type){
    const n=d.cl.length?`Classes finish at ${toT(Math.max(...d.cl.map(c=>toM(c.end))))}`:'No classes today';
    if(d.place==='home'){
      if((S.settings.homeDays||[]).includes(d.wd))return `${n}. This is one of your home days, so it is a ${S.settings.homeMin}-minute workout with no equipment at ${toT(d.slot.start)}.`;
      return `${n}, and the gym does not fit today. A ${S.settings.homeMin}-minute home workout with no equipment fits at ${toT(d.slot.start)}.`;
    }
    return `${n}, so ${toT(d.slot.start)} is free. You still finish more than 2 hours before bed.`;
  }
  if(d.examToday)return 'Exam today. Your head gets the energy, not the gym.';
  if(d.classMin>=360)return 'A long day at uni, so this stays a rest day.';
  return 'Muscles grow while you rest. This day keeps your training spread out.';
}
function planWeek(mon){
  if(weekCache[mon])return weekCache[mon];
  const dates=[...Array(7)].map((_,i)=>addDays(mon,i));
  const facts=dates.map(dayFacts),slots=facts.map(slotFor);
  const n=S.settings.days;
  const idx=chooseDays(facts,slots,n);
  const types=assignTypes(idx,facts,n);
  const days=facts.map((f,i)=>({...f,slot:slots[i],type:types[i]||null,place:slots[i]?slots[i].place:'gym'}));
  const ov=S.schedule.overrides||{};
  days.forEach(d=>{
    const o=ov[d.date];if(!o)return;
    if(o.rest){d.type=null;d.forcedRest=true}
    else if(o.type){d.type=o.type;d.moved=true;d.place=o.place||(d.slot&&d.slot.place)||'gym';const len=d.place==='home'?S.settings.homeMin:S.settings.sessionMin;const alt=d.place==='home'?homeSlot(d):gymSlot(d);const s=toM(o.time)??(alt&&alt.start)??(d.slot&&d.slot.start)??1050;d.slot={start:s,end:s+len,score:0,place:d.place}}
  });
  days.forEach(d=>{d.why=dayWhy(d);d.blocks=buildBlocks(d)});
  return weekCache[mon]={mon,days,deload:isDeload(mon)};
}
function buildBlocks(d){
  const st=S.settings,bl=[];
  const add=(id,kind,start,end,title,sub,extra)=>bl.push({id,kind,start,end,title,sub:sub||'',...extra});
  const free=(len,from,to)=>{const b=bl.filter(x=>x.kind!=='sleep'&&x.kind!=='wake').map(x=>[x.start,x.end]).sort((a,c)=>a[0]-c[0]);const gaps=gapsIn(from,to,mergeI(b));const g=gaps.find(x=>x[1]-x[0]>=len);return g?g[0]:null};
  add('wake','wake',d.wake,d.wake+10,'Wake up',d.wake===toM(st.wake)?'Same time as usual keeps your rhythm':'Earlier today because of your first class');
  add('breakfast','meal',d.wake+15,d.wake+45,'Breakfast');
  d.cl.forEach(c=>add('c'+c.id,'class',toM(c.start),toM(c.end),c.title,[c.room,c.kind].filter(Boolean).join(' · ')));
  d.ex.forEach(e=>{const s=toM(e.time)??540;add('e'+e.id,'exam',s,s+120,'Exam: '+e.title)});
  const anchors=[...d.cl.map(c=>[toM(c.start),toM(c.end)]),...d.ex.filter(e=>e.time).map(e=>[toM(e.time),toM(e.time)+120])];
  if(anchors.length){
    const first=Math.min(...anchors.map(a=>a[0])),last=Math.max(...anchors.map(a=>a[1]));
    add('c-in','commute',first-st.commute,first,'Travel to uni');
    add('c-out','commute',last,last+st.commute,'Travel home');
  }
  if(d.type&&d.slot)add('gym','gym',d.slot.start,d.slot.end,d.place==='home'?TYPES[d.type].l+' at home':TYPES[d.type].l+' day',d.place==='home'?`No equipment · ${S.settings.homeMin} min`:TYPES[d.type].s,{type:d.type,place:d.place});
  const lunch=free(40,720,870);if(lunch!=null)add('lunch','meal',lunch,lunch+40,'Lunch');
  const dinnerFrom=d.type&&d.slot&&d.slot.end>=1020?d.slot.end+20:1125;
  const dinner=free(40,dinnerFrom,Math.min(d.bed-60,1320));if(dinner!=null)add('dinner','meal',dinner,dinner+40,'Dinner',d.type?'Include protein to help recovery':'');
  const soonExam=S.timetable.exams.some(e=>{const x=diffDays(e.date,d.date);return x>0&&x<=7})||examSeason(d.date);
  let toStudy=Math.round(st.studyH*60)+(soonExam?60:0),n=0;
  if(d.examToday)toStudy=0;
  while(toStudy>=25&&n<6){
    const len=Math.min(50,toStudy);const s=free(len,Math.max(d.wake+60,540),Math.min(d.bed-90,1260));if(s==null)break;
    add('study'+n,'study',s,s+len,'Study block',soonExam?'Exam within a week':'');toStudy-=len;n++;
    add('gap'+n,'gapx',s+len,s+len+10,'');
  }
  add('wind','wind',d.bed-45,d.bed,'Wind down','Screens off, lights low');
  add('sleep','sleep',d.bed,d.bed+15,'Bed',`${st.sleepH} h of sleep before tomorrow`);
  return bl.filter(b=>b.kind!=='gapx').sort((a,b)=>a.start-b.start);
}
function mergeI(a){const o=[];a.forEach(i=>{const l=o[o.length-1];if(l&&i[0]<=l[1])l[1]=Math.max(l[1],i[1]);else o.push([...i])});return o}

/* ---------- Readiness ---------- */
function median(a){const s=[...a].sort((x,y)=>x-y);if(!s.length)return null;const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function hoursOf(l){if(l.sleepHours!=null&&l.sleepHours!=='')return +l.sleepHours;if(l.bed&&l.wake){let b=toM(l.bed),w=toM(l.wake);if(w<=b)w+=1440;return (w-b)/60}return null}
function bedClock(t){const m=toM(t);return m<720?m+1440:m}
function readinessFor(date){
  const l=sleepFor(date);if(!l)return null;
  const st=S.settings,comps=[],mods=[];
  const hours=hoursOf(l);
  let sl=l.sleepScore!=null&&l.sleepScore!==''?+l.sleepScore:(hours!=null?clamp(hours/st.sleepH*90,0,100):null);
  if(sl!=null)comps.push({k:'sleep',label:'Sleep',v:Math.round(sl),w:.35});
  if(l.bodyBattery!=null&&l.bodyBattery!=='')comps.push({k:'bb',label:'Body Battery',v:+l.bodyBattery,w:.25});
  if(l.hrv)comps.push({k:'hrv',label:'HRV',v:{balanced:85,unbalanced:55,low:30}[l.hrv]??60,w:.1});
  if(l.mind)comps.push({k:'mind',label:'Head',v:Math.round((l.mind-1)/4*100),w:.15});
  if(l.sore)comps.push({k:'sore',label:'Body',v:Math.round((5-l.sore)/4*100),w:.15});
  if(!comps.length)return null;
  const tw=comps.reduce((a,c)=>a+c.w,0);
  let score=comps.reduce((a,c)=>a+c.v*c.w,0)/tw;
  const past=[...Array(14)].map((_,i)=>sleepFor(addDays(date,-i-1))).filter(Boolean);
  const rhrs=past.map(p=>+p.restingHR).filter(Boolean);
  if(l.restingHR&&rhrs.length>=3&&+l.restingHR>=median(rhrs)+5){mods.push(['Resting heart rate is higher than usual',-5])}
  const last3=[l,...past.slice(0,2)].map(hoursOf).filter(h=>h!=null);
  if(last3.length>=2&&last3.reduce((a,b)=>a+b,0)/last3.length<st.sleepH-1)mods.push(['Short on sleep over the last few nights',-5]);
  const beds=past.slice(0,7).filter(p=>p.bed).map(p=>bedClock(p.bed));
  if(l.bed&&beds.length>=3&&Math.abs(bedClock(l.bed)-median(beds))>90)mods.push(['Went to bed at an unusual time',-4]);
  const f=dayFacts(date);
  if(f.classMin>=360)mods.push(['Long day of classes',-5]);
  if(f.examTomorrow)mods.push(['Exam tomorrow',-8]);
  score+=mods.reduce((a,m)=>a+m[1],0);
  score=Math.round(clamp(score,0,100));
  let key=score>=70?'go':score>=45?'steady':'recover';
  let capped=false;
  if(key==='go'&&(f.examToday||f.examTomorrow)){key='steady';capped=true}
  const low=[...comps].sort((a,b)=>a.v-b.v)[0];
  return{score,key,capped,comps,mods,low,band:BANDS[key],text:bandText(key,low,capped)};
}
const BANDS={go:{word:'Go for it',color:'var(--good)',ink:'var(--good-ink)'},steady:{word:'Keep it steady',color:'var(--warn)',ink:'var(--warn-ink)'},recover:{word:'Recover today',color:'var(--bad)',ink:'var(--bad-ink)'}};
function bandText(key,low,capped){
  if(capped)return 'Your body is ready, but an exam is close. Same exercises, one set less, no new weights, so your head stays fresh.';
  if(key==='go')return 'You recovered well. Do the full session and try the new targets.';
  if(key==='steady')return `${low.label} is your lowest score today. Same exercises, one set less, and no new weights.`;
  return `${low.label} is very low today. Heavy lifting would cost more than it gives, so today is easy movement only.`;
}
function modeFor(date){const r=readinessFor(date);return r?r.key:'go'}
function isDeload(mon){
  const first=Object.values(S.sessions).map(s=>s.date).sort()[0];
  const weeks=first?Math.floor(diffDays(mon,monOf(first))/7):0;
  if(first&&weeks>0&&weeks%6===5)return 'planned';
  const scores=[...Array(7)].map((_,i)=>readinessFor(addDays(mon,-i-1))).filter(Boolean).map(r=>r.score);
  if(scores.length>=4&&scores.reduce((a,b)=>a+b,0)/scores.length<50)return 'tired';
  return null;
}

/* ---------- Workouts and progression ---------- */
function exInfo(id){return EX[id]||(S.program.custom&&S.program.custom[id])||{n:id,m:'core',t:'mc',k:'i',inc:2.5,cue:''}}
function schemeFor(info){
  if(info.t==='bw'){
    const comp=info.k==='c',range=info.u==='s'?[30,60]:comp?(S.settings.goal==='strength'?[6,10]:[8,15]):[10,20];
    return{sets:S.settings.level==='advanced'&&comp?4:3,repMin:range[0],repMax:range[1],rest:comp?75:60};
  }
  const g=GOALS[S.settings.goal]||GOALS.muscle,lv=S.settings.level;
  const comp=info.k==='c';
  const sets=lv==='beginner'?(comp?3:2):lv==='advanced'?(comp?4:3):(comp?4:3);
  const[repMin,repMax]=comp?g.c:g.i;
  return{sets,repMin,repMax,rest:comp?g.rc:g.ri};
}
function chainOf(ex){return Object.values(CHAINS).find(c=>c.includes(ex))||null}
function resolveChain(root,date){
  const ch=CHAINS[root];if(!ch)return root;
  let i=S.settings.level!=='beginner'&&ch.length>=3?1:0;
  for(let k=ch.length-1;k>=0;k--)if(historyOf(ch[k],date).length){i=k;break}
  const h=historyOf(ch[i],date);
  if(h.length){
    const sc=schemeFor(exInfo(ch[i])),b=bestOf(h[0].e);
    if(b.minR>=sc.repMax&&h[0].e.effort!=='max'&&i<ch.length-1)i++;
    else if(i>0&&h.length>=2&&b.minR<sc.repMin&&bestOf(h[1].e).minR<sc.repMin)i--;
  }
  return ch[i];
}
function programFor(type,place,date){
  if(place==='home'){const seen=new Set();return HOME[type].map(r=>resolveChain(r,date||todayKey())).filter(x=>{if(seen.has(x))return false;seen.add(x);return true}).map(ex=>({ex,...schemeFor(exInfo(ex))}))}
  const custom=S.program[type];
  if(Array.isArray(custom))return custom.map(c=>{const i=exInfo(c.ex),s=schemeFor(i);return{ex:c.ex,sets:c.sets||s.sets,repMin:c.repMin||s.repMin,repMax:c.repMax||s.repMax,rest:s.rest}});
  const eq=S.settings.equip,seen=new Set();
  return TEMPLATES[type].map(id=>{let x=id;if(eq==='db'&&EX[id].t!=='db'&&EX[id].sub)x=EX[id].sub;return x}).filter(x=>{if(seen.has(x))return false;seen.add(x);return true}).map(ex=>{const s=schemeFor(exInfo(ex));return{ex,...s}});
}
function fitToTime(list,min){
  const out=[];let t=6;
  for(const it of list){const c=it.sets*(it.rest+45)/60;if(out.length>=3&&t+c>min)break;out.push(it);t+=c}
  return out;
}

}

   <button class="tick" data-a="tick" data-x="${x}" data-s="${i}" aria-label="Set ${i+1} done">✓</button></div>`).join('')}</div>
  ${allDone?`<div class="field"><span class="flabel">How did that feel?</span><div class="effort">${[['easy','Easy'],['good','Good'],['max','At my limit']].map(([v,l])=>`<button class="chip ${e.effort===v?'on':''}" data-a="effort" data-x="${x}" data-v="${v}">${l}</button>`).join('')}</div></div>`:''}

function sheetOpen(html){const el=document.getElementById('sheet');el.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`;el.hidden=false}

function startTimer(sec){timerState={end:Date.now()+sec*1000};tickTimer();}
function tickTimer(){

  if(b)b.textContent=txt;else{el.innerHTML=`<div><span style="font-size:.85rem;font-weight:600">Rest</span><b>${txt}</b><button data-a="timer-add">+30 s</button><button data-a="timer-stop">Skip</button></div>`;el.hidden=false}
}
setInterval(tickTimer,500);
function finishSession(s){
  s.finished=true;s.finishedAt=Date.now();save.session(s);
  try{wakeLock&&wakeLock.release()}catch(e){}timerState=null;
  let vol=0,sets=0;const prs=[];
  s.exercises.forEach(e=>{
    const done=e.sets.filter(a=>a.done);sets+=done.length;
    done.forEach(a=>vol+=(+a.w||0)*(+a.r||0));
    if(!done.length)return;
    const best=Math.max(...done.map(a=>e1rm(+a.w||0,+a.r||0)));
    const h=historyOf(e.ex,s.date);
    if(h.length){const prev=Math.max(...h.flatMap(x=>x.e.sets.filter(a=>a.done).map(a=>e1rm(+a.w||0,+a.r||0))));if(best>prev+.01)prs.push(exInfo(e.ex).n)}

/* ---------- Charts ---------- */
function niceTicks(a,b,n){const raw=(b-a)/n,mag=10**Math.floor(Math.log10(raw||1));const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||mag*10;const out=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st)out.push(Math.round(v*100)/100);return out}
function lineChart(pts,unit){
  const W=340,H=170,pl=34,pr=46,pt=14,pb=24;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);const gap=Math.max(2.5,(mx-mn)*.2);mn=Math.max(0,mn-gap);mx+=gap;
  const t0=parseD(pts[0].x).getTime(),t1=parseD(pts[pts.length-1].x).getTime();
  const X=x=>pl+(t1===t0?(W-pl-pr)/2:(parseD(x).getTime()-t0)/(t1-t0)*(W-pl-pr)),Y=y=>pt+(1-(y-mn)/(mx-mn))*(H-pt-pb);
  const ticks=niceTicks(mn,mx,3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimated strength over time">`;
  ticks.forEach(v=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`});
  s+=`<text x="${pl}" y="${H-6}">${shortDate(pts[0].x)}</text>`;
  if(pts.length>1)s+=`<text x="${W-pr}" y="${H-6}" text-anchor="end">${shortDate(pts[pts.length-1].x)}</text>`;
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${last?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><rect x="${X(p.x)-13}" y="${pt}" width="26" height="${H-pt-pb}" fill="transparent" data-tip="${shortDate(p.x)}: ${p.y} ${unit}${p.note?' · '+esc(p.note):''}"/>`});
  const e=pts[pts.length-1];s+=`<text class="val" x="${X(e.x)+9}" y="${Y(e.y)+4}">${e.y}</text>`;
  return s+'</svg>';
}
function sleepBars(rows){
  const W=340,H=150,pl=28,pr=4,pt=12,pb=22,step=(W-pl-pr)/rows.length,bw=Math.max(6,step-3);
  const Y=v=>pt+(1-v/100)*(H-pt-pb);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep score per night">`;
  [0,50,100].forEach(v=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-5}" y="${Y(v)+3.5}" text-anchor="end">${v}</text>`});
  rows.forEach((r,i)=>{const x=pl+i*step+1.5;
    if(r.v==null)return;
    const y=Y(r.v),h=Y(0)-y,c=r.v>=80?'var(--good)':r.v>=60?'var(--warn)':'var(--bad)',rr=Math.min(4,h/2,bw/2);
    s+=`<path d="M${x} ${Y(0)}V${y+rr}Q${x} ${y} ${x+rr} ${y}H${x+bw-rr}Q${x+bw} ${y} ${x+bw} ${y+rr}V${Y(0)}Z" fill="${c}"/><rect x="${x-1}" y="${pt}" width="${bw+2}" height="${H-pt-pb}" fill="transparent" data-tip="${shortDate(r.d)}: score ${r.v}"/>`});
  s+=`<text x="${pl}" y="${H-6}">${shortDate(rows[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${shortDate(rows[rows.length-1].d)}</text>`;
  return s+'</svg>';
}
function rhythmChart(rows,targetBed){
  const W=340,rh=17,pl=44,pr=8,pt=18,H=pt+rows.length*rh+4,A=21*60,B=35*60;
  const X=m=>pl+(clamp(m,A,B)-A)/(B-A)*(W-pl-pr);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep times per night">`;
  [21,23,25,27,29,31,33,35].forEach(h=>{const x=X(h*60);s+=`<line class="grid" x1="${x}" x2="${x}" y1="${pt}" y2="${H-4}"/><text x="${x}" y="${pt-6}" text-anchor="middle">${pad(h%24)}</text>`});
  rows.forEach((r,i)=>{const y=pt+i*rh+3;

function table(heads,rows){return `<details class="tbl"><summary>Show the numbers</summary><div class="tblwrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`}

/* ---------- Progress ---------- */
function liftSeries(ex){return Object.values(S.sessions).map(s=>({date:s.date,e:(s.exercises||[]).find(x=>x.ex===ex)})).filter(x=>x.e&&x.e.sets.some(a=>a.done&&+a.w>0)).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{const best=x.e.sets.filter(a=>a.done&&+a.w>0).reduce((m,a)=>e1rm(+a.w,+a.r)>e1rm(+m.w,+m.r)?a:m);return{x:x.date,y:Math.round(e1rm(+best.w,+best.r)*10)/10,note:`${fmtKg(+best.w)} × ${best.r}`}})}
function loggedExercises(){const c={};Object.values(S.sessions).forEach(s=>(s.exercises||[]).forEach(e=>{if(e.sets.some(a=>a.done&&+a.w>0))c[e.ex]=(c[e.ex]||0)+1}));return Object.keys(c).sort((a,b)=>c[b]-c[a])}
function weeklySets(endDate){const c={};MUSCLES.forEach(m=>c[m]=0);Object.values(S.sessions).forEach(s=>{const x=diffDays(endDate,s.date);if(x<0||x>=7)return;(s.exercises||[]).forEach(e=>{c[exInfo(e.ex).m]=(c[exInfo(e.ex).m]||0)+e.sets.filter(a=>a.done).length})});return c}
function viewProgress(){
  const today=todayKey(),ex=loggedExercises();
  if(!chartEx||!ex.includes(chartEx))chartEx=ex[0]||null;
  /* Lift */
  let lift=`<div class="empty">Finish a workout and your strength line starts here.</div>`;
  if(chartEx){
    const pts=liftSeries(chartEx);
    const f=pts[0],l=pts[pts.length-1],delta=Math.round((l.y-f.y)*10)/10;
    const msg=pts.length<2?'One workout logged so far. Do this exercise again and you get a line.':delta>0?`Up ${delta} kg since ${shortDate(f.x)}. You are getting stronger.`:delta<0?`Down ${Math.abs(delta)} kg since ${shortDate(f.x)}. Check your sleep and rest before adding weight.`:`Flat since ${shortDate(f.x)}. Reps go up first, then the weight follows.`;
    lift=`<select id="chart-ex" data-c="chart-ex" aria-label="Exercise">${ex.map(id=>`<option value="${id}" ${id===chartEx?'selected':''}>${esc(exInfo(id).n)}</option>`).join('')}</select>${lineChart(pts,'kg')}<p class="plain">${esc(msg)}</p><p class="small">This line is your estimated 1-rep max: the most you could lift once, worked out from your best set. You never need to test it for real.</p>${table(['Date','Best set','Estimated max'],pts.map(p=>[shortDate(p.x),p.note,p.y+' kg']))}`;
  }
  /* Volume */
  const c=weeklySets(today),hasVol=Object.values(c).some(v=>v>0);
  const maxV=Math.max(20,...Object.values(c));
  const vol=hasVol?`<div class="factors">${MUSCLES.map(m=>`<div class="factor" style="grid-template-columns:82px 1fr 26px"><span style="text-transform:capitalize">${m}</span><div class="track" style="position:relative;height:12px;border-radius:5px"><div style="position:absolute;left:${10/maxV*100}%;width:${10/maxV*100}%;top:0;bottom:0;background:var(--band)"></div><div class="fill" style="position:relative;width:${c[m]/maxV*100}%;background:var(--accent)"></div></div><b>${c[m]}</b></div>`).join('')}</div><div class="legend"><span><i style="background:var(--accent)"></i>Sets done</span><span><i style="background:var(--band)"></i>Good range: 10–20 sets a week</span></div><p class="plain">${esc(volMsg(c))}</p>`:'<div class="empty">Log sets this week to see which muscles get enough work.</div>';
  /* Sleep */
  const nights=[...Array(14)].map((_,i)=>addDays(today,i-13)).map(d=>({d,l:sleepFor(d)}));
  const sc=nights.map(n=>({d:n.d,v:n.l&&n.l.sleepScore!=null&&n.l.sleepScore!==''?+n.l.sleepScore:null}));

const COACH_RULES=ctx=>`You are the coach inside Rep Rhythm, a phone app that plans one university student's gym training and daily routine around their timetable and Garmin sleep data.

}

  <div class="two"><div class="field"><label for="c-start">Starts</label><input id="c-start" type="time" value="10:00"></div><div class="field"><label for="c-end">Ends</label><input id="c-end" type="time" value="11:30"></div></div>
  <div class="field"><label for="c-room">Room (optional)</label><input id="c-room" type="text"></div><button class="btn primary full" data-a="save-class">Add class</button>`)}
function addExamSheet(){sheetOpen(`<div class="row between"><h2>Add an exam</h2><button class="x" data-a="sheet-close" aria-label="Close">×</button></div>
  <div class="field"><label for="e-title">Name</label><input id="e-title" type="text"></div><div class="two"><div class="field"><label for="e-date">Date</label><input id="e-date" type="date" value="${todayKey()}"></div><div class="field"><label for="e-time">Time</label><input id="e-time" type="time" value="09:00"></div></div><p class="small">Heavy training stops on exam days and the day before, so your head stays fresh.</p><button class="btn primary full" data-a="save-exam">Add exam</button>`)}
function notTodaySheet(){
  const date=todayKey(),pl=planWeek(monOf(date)),opts=[1,2,3].map(n=>addDays(date,n));
  sheetOpen(`<div class="row between"><h2>Not today</h2><button class="x" data-a="sheet-close" aria-label="Close">×</button></div><p class="plain">Move this session or take the day off. The rest of your plan stays the same.</p>
  <div class="list">${opts.map(o=>{const d=weekDay(o);const clash=d.type?` (replaces ${TYPES[d.type].l})`:'';return `<div><span>${WDL[wdOf(o)]} ${shortDate(o)}${esc(clash)}</span><button class="btn thin" data-a="move-today" data-v="${o}">Move here</button></div>`}).join('')}</div>
  ${weekDay(date).place!=='home'?`<button class="btn primary full" data-a="home-today">Do it at home instead (no equipment)</button>`:''}
  <button class="btn full" data-a="rest-today">Make today a rest day</button>`);
}
function weekDay(date){return planWeek(monOf(date)).days[wdOf(date)]}
function swapSheet(x){
  const s=activeSession(),e=s.exercises[x],info=exInfo(e.ex);
  const eq=S.settings.equip;
  const opts=Object.entries(EX).filter(([k,v])=>v.m===info.m&&k!==e.ex&&(s.place==='home'?v.t==='bw':(eq!=='db'||v.t==='db'||v.t==='bw')));
  sheetOpen(`<div class="row between"><h2>Swap ${esc(info.n)}</h2><button class="x" data-a="sheet-close" aria-label="Close">×</button></div><p class="plain">Same muscle, different exercise. Useful if a machine is taken or something hurts.</p><div class="list">${opts.map(([k,v])=>`<div><span class="grow">${esc(v.n)}</span><button class="btn thin" data-a="do-swap" data-x="${x}" data-v="${k}">Use</button></div>`).join('')}</div>`);
}
function recoverySheet(){sheetOpen(`<div class="row between"><h2>Easy day</h2><button class="x" data-a="sheet-close" aria-label="Close">×</button></div><p class="plain">Blood flow helps you recover without adding stress. About 30 minutes.</p><div class="list">${RECOVERY.map(x=>`<div><div class="grow"><b style="font-weight:600">${esc(x[0])}</b><div class="small">${esc(x[1])}</div></div></div>`).join('')}</div><button class="btn primary full" data-a="sheet-close">Done</button>`)}

/* ---------- Screenshot and file reading ---------- */
async function readGarmin(file){
  const st=document.getElementById('garmin-status');if(st)st.textContent='Reading your screenshot…';
  try{
    const out=await sample.json(`This image is a screenshot from the Garmin Connect app. Read only values that are clearly visible. Reply with only JSON: {"sleepScore":number|null,"sleepHours":number|null,"bed":"HH:MM"|null,"wake":"HH:MM"|null,"bodyBattery":number|null,"restingHR":number|null,"hrv":"balanced"|"unbalanced"|"low"|null}. Use 24-hour time. bodyBattery means the morning charged or current value. Use null for anything you cannot see, and never guess.`,{images:file,cache:false});
    const dd=sleepDraft;let n=0;['sleepScore','sleepHours','bodyBattery','restingHR'].forEach(k=>{if(typeof out[k]==='number'){dd[k]=out[k];n++}});['bed','wake'].forEach(k=>{if(isT(out[k])){dd[k]=out[k].padStart(5,'0');n++}});if(['balanced','unbalanced','low'].includes(out.hrv)){dd.hrv=out.hrv;n++}
    render();const s2=document.getElementById('garmin-status');if(s2)s2.textContent=n?`Found ${n} value${n===1?'':'s'}. Check them, then continue.`:'I could not find any numbers. Try the Sleep screen in Garmin Connect.';
  }catch(e){const s2=document.getElementById('garmin-status');if(s2)s2.textContent=aiError(e)}
}
async function readTimetable(file){
  const st=document.getElementById('tt-status');if(st)st.textContent='Reading your timetable…';
  const base=`Read this university timetable. Today is ${todayKey()}. Reply with only JSON: {"classes":[{"day":0,"start":"HH:MM","end":"HH:MM","title":"short course name","room":"","kind":"lecture|lab|exercise|other"}],"exams":[{"date":"YYYY-MM-DD","title":"","time":"HH:MM"}],"note":"anything you were unsure about, or empty"}. day 0 is Monday and 6 is Sunday. Use 24-hour time. List a class that repeats weekly only once. If weeks differ, use the current week or the next week that has classes, and say so in note.`;
  try{
    let out;
    if(file.type.startsWith('image/'))out=await sample.json(base,{images:file,cache:false});
    else{const txt=(await file.text()).slice(0,120000);out=await sample.json(base+'\n\nFile contents:\n'+txt,{cache:false})}
    const classes=(out.classes||[]).filter(c=>c.day>=0&&c.day<=6&&isT(c.start)&&isT(c.end)).map(c=>({id:uid(),day:+c.day,start:c.start.padStart(5,'0'),end:c.end.padStart(5,'0'),title:String(c.title||'Class').slice(0,80),room:String(c.room||'').slice(0,60),kind:c.kind||'lecture'}));
    const exams=(out.exams||[]).filter(e=>isD(e.date)).map(e=>({id:uid(),date:e.date,title:String(e.title||'Exam').slice(0,80),time:isT(e.time)?e.time.padStart(5,'0'):''}));
    if(!classes.length&&!exams.length){if(st)st.textContent='I could not find any classes. Try a clearer screenshot.';return}
    ttDraft={classes,exams};
    sheetOpen(`<div class="row between"><h2>Is this right?</h2><button class="x" data-a="sheet-close" aria-label="Close">×</button></div><p class="plain">Found ${classes.length} weekly class${classes.length===1?'':'es'}${exams.length?` and ${exams.length} exam${exams.length===1?'':'s'}`:''}. Saving replaces your current timetable.</p>${out.note?`<div class="banner"><span class="plain">${esc(out.note)}</span></div>`:''}<div class="list">${classes.sort((a,b)=>a.day-b.day||toM(a.start)-toM(b.start)).map(c=>`<div><div class="grow"><b style="font-weight:600">${esc(c.title)}</b><div class="small">${WD[c.day]} ${esc(c.start)}–${esc(c.end)}${c.room?' · '+esc(c.room):''}</div></div></div>`).join('')}${exams.map(e=>`<div><div class="grow"><b style="font-weight:600">Exam: ${esc(e.title)}</b><div class="small">${shortDate(e.date)}</div></div></div>`).join('')}</div><button class="btn primary full" data-a="tt-save">Save timetable</button>`);
    if(st)st.textContent='';
  }catch(e){if(st)st.textContent=aiError(e)}
}
let ttDraft=null;

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,x=+b.dataset.x,i=+b.dataset.s;
  const s=activeSession();
  const handlers={
    tab(){tab=v;try{localStorage.setItem(LS+'.tab',v)}catch(er){}render();window.scrollTo(0,0)},
    settings(){draft=clone(S.settings);settingsSheet()},
    'sheet-close'(){draft=null;sheetClose()},
    connect(){connectSheet()},
    'save-connect'(){window.RR.saveConfig(readConnect());location.reload()},
    async 'test-connect'(){const c=readConnect();connectSheet('Checking…',c);connectSheet(await window.RR.testGitHub(c),c)},
    install(){window.RR.install().then(()=>render())},
    'sheet-close-today'(){sheetClose();tab='today';render();window.scrollTo(0,0)},
    'goto-week'(){tab='week';render();window.scrollTo(0,document.body.scrollHeight)},
    'goto-train'(){tab='train';render();window.scrollTo(0,0)},
    chip(){
      const g=b.dataset.g;
      if(g==='s-homeDays'){const n=+v,a=new Set(draft.homeDays||[]);a.has(n)?a.delete(n):a.add(n);draft.homeDays=[...a].sort();const t3=document.querySelector('#sheet>div').scrollTop;settingsSheet();document.querySelector('#sheet>div').scrollTop=t3;return}
      if(g.startsWith('s-')){const k=g.slice(2);draft[k]=isNaN(+v)?v:+v;const top2=document.querySelector('#sheet>div').scrollTop;settingsSheet();document.querySelector('#sheet>div').scrollTop=top2;return}
      const st=window.scrollY;sleepDraft[g]=isNaN(+v)?v:+v;if(g==='hrv'&&b.classList.contains('on'))delete sleepDraft.hrv;render();window.scrollTo(0,st);
    },
    'save-settings'(){
      document.querySelectorAll('#sheet [data-d]').forEach(el=>{const k=el.dataset.d;draft[k]=el.type==='time'?el.value:(+el.value)});
      draft.sleepH=clamp(draft.sleepH||8,6,10);draft.setupDone=true;S.settings=draft;draft=null;save.settings();sheetClose();render();
    },
    'save-sleep'(){const date=todayKey();const l=sleepDraft;if(!['sleepScore','bodyBattery','mind','sore','hrv'].some(k=>l[k]!=null&&l[k]!=='')&&!(l.bed&&l.wake)){document.getElementById('sleep-msg').textContent='Set at least one number first, such as your sleep score.';return}l.date=date;l.source='manual';['sleepScore','bodyBattery'].forEach(k=>{if(l[k]!=null)l[k]=+l[k]});if(l.restingHR)l.restingHR=+l.restingHR;else delete l.restingHR;if(l.bed&&l.wake)l.sleepHours=Math.round(hoursOf({bed:l.bed,wake:l.wake})*10)/10;S.sleep[date]=clone(l);save.sleep(date);sleepDraft=null;editingSleep=false;render();window.scrollTo(0,0)},
    'edit-sleep'(){editingSleep=true;sleepDraft=clone(S.sleep[todayKey()]);render()},
    routine(){const d=b.dataset.d;const r=S.routine[d]=S.routine[d]||{date:d,done:{}};r.done[v]=!r.done[v];save.routine(d);const row=b.closest('.tl-row');row.classList.toggle('done',!!r.done[v])},
    start(){startSession(v,b.dataset.m,b.dataset.p)},
    'train-place'(){trainPlace=v;render()},
    'home-today'(){const date=todayKey(),d=weekDay(date);S.schedule.overrides[date]={type:d.type,place:'home',time:null};save.schedule();invalidate();sheetClose();render()},
    'start-recovery'(){recoverySheet()},
    'not-today'(){notTodaySheet()},
    'move-today'(){const date=todayKey(),d=weekDay(date);S.schedule.overrides[date]={rest:true};S.schedule.overrides[v]={type:d.type,time:null};save.schedule();invalidate();sheetClose();render()},
    'rest-today'(){S.schedule.overrides[todayKey()]={rest:true};save.schedule();invalidate();sheetClose();render()},
    step(){const f=b.dataset.f,d=+b.dataset.d,it=s.exercises[x].sets[i];const nv=Math.max(0,Math.round(((+it[f]||0)+d)*100)/100);it[f]=nv;propagate(s,x,i,f,nv);save.session(s);syncSetInputs(s,x)},
    tick(){
      const it=s.exercises[x].sets[i];
      if(!it.done&&(it.w==null||it.w===''||it.r==null||it.r==='')){const el=document.getElementById((it.w==null||it.w===''?'w':'r')+`-${x}-${i}`);if(el)el.focus();return}
      it.done=!it.done;save.session(s);if(it.done)startTimer(s.exercises[x].rest||90);else timerState=null;render();
    },
    effort(){s.exercises[x].effort=v;save.session(s);render()},
    swap(){swapSheet(x)},
    'do-swap'(){const e=s.exercises[x],info=exInfo(v),sc=schemeFor(info);const t=suggest({ex:v,repMin:sc.repMin,repMax:sc.repMax},s.date,s.mode,false);e.ex=v;e.repMin=sc.repMin;e.repMax=sc.repMax;e.rest=sc.rest;e.effort=null;e.target={title:t.title,why:t.why,kind:t.kind,first:!!t.first,last:t.last||''};e.sets=e.sets.map(()=>({w:info.t==='bw'?0:t.w,r:t.r,done:false}));save.session(s);sheetClose();render()},
    finish(){finishSession(s)},
    discard(){if(!discardArmed){discardArmed=true;render();setTimeout(()=>{discardArmed=false;if(tab==='train')render()},4000);return}discardArmed=false;delete S.sessions[s.id];persist('sessions/'+s.id,null);timerState=null;render()},
    'timer-add'(){if(timerState)timerState.end+=30000},
    'timer-stop'(){timerState=null;tickTimer()},
    'week-move'(){weekMon=addDays(weekMon,+v);selDay=null;render()},
    'sel-day'(){selDay=v;render()},
    'add-class'(){addClassSheet()},
    'save-class'(){const t=document.getElementById('c-title').value.trim();if(!t){document.getElementById('c-title').focus();return}applyChange({type:'add_class',day:+document.getElementById('c-day').value,start:document.getElementById('c-start').value,end:document.getElementById('c-end').value,title:t,room:document.getElementById('c-room').value});sheetClose();render()},
    'del-class'(){applyChange({type:'remove_class',id:v});render()},
    'add-exam'(){addExamSheet()},
    'save-exam'(){const t=document.getElementById('e-title').value.trim();if(!t){document.getElementById('e-title').focus();return}applyChange({type:'add_exam',date:document.getElementById('e-date').value,time:document.getElementById('e-time').value,title:t});sheetClose();render()},
    'del-exam'(){applyChange({type:'remove_exam',id:v});render()},
    'tt-save'(){S.timetable.classes=ttDraft.classes;S.timetable.exams=[...S.timetable.exams.filter(e=>!ttDraft.exams.some(n=>n.date===e.date&&n.title===e.title)),...ttDraft.exams];ttDraft=null;save.timetable();sheetClose();render()},
    send(){const el=document.getElementById('coach-input');const t=el.value;el.value='';coachSend(t)},
    quick(){coachSend(v)},
    'coach-apply'(){let ok=0,fail=0;coachChanges.forEach(c=>{applyChange(c)?ok++:fail++});coachChanges=null;invalidate();S.chat.turns.push({role:'assistant',content:fail?`Applied ${ok}. I could not apply ${fail}.`:`Done. Applied ${ok} change${ok===1?'':'s'}.`});save.chat();render()},
    'coach-skip'(){coachChanges=null;render()},
    'clear-chat'(){S.chat.turns=[];coachChanges=null;save.chat();render()},
  };
  (handlers[a]||(()=>{}))();
});
function propagate(s,x,i,f,nv){
  /* Changing a set carries forward to later sets that are not done yet */
  s.exercises[x].sets.forEach((a,j)=>{if(j>i&&!a.done)a[f]=nv});
}
function syncSetInputs(s,x){s.exercises[x].sets.forEach((a,j)=>{['w','r'].forEach(f=>{const el=document.getElementById(`${f}-${x}-${j}`);if(el&&document.activeElement!==el)el.value=a[f]??''})})}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i){const k=t.dataset.i;sleepDraft[k]=t.value;if(k==='sleepScore')document.getElementById('o-score').textContent=t.value;if(k==='bodyBattery')document.getElementById('o-bb').textContent=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target,c=t.dataset.c;if(!c)return;
  if(c==='set'){const s=activeSession(),x=+t.dataset.x,i=+t.dataset.s,f=t.dataset.f,raw=t.value.replace(',','.').trim();const val=raw===''?null:Math.max(0,+raw||0);s.exercises[x].sets[i][f]=val;if(val!=null)propagate(s,x,i,f,val);save.session(s);syncSetInputs(s,x)}
  if(c==='chart-ex'){chartEx=t.value;render()}
  if(c==='garmin-file'&&t.files[0])readGarmin(t.files[0]);
  if(c==='tt-file'&&t.files[0])readTimetable(t.files[0]);
});
const tip=document.getElementById('tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t||!t.dataset.tip){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=clamp(e.clientX-r.width/2,8,window.innerWidth-r.width-8)+'px';tip.style.top=Math.max(8,e.clientY-r.height-14)+'px'}
document.addEventListener('pointerdown',showTip);document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')showTip(e)});
document.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});
window.addEventListener('online',flushAll);
let lastPull=0;
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  if(activeSession()&&activeSession().id){keepAwake()}
  flushAll();
  if(Date.now()-lastPull<60000||Object.keys(pending).length)return;
  const act=document.activeElement;if(act&&/INPUT|TEXTAREA/.test(act.tagName))return;
  if(!document.getElementById('sheet').hidden||sleepDraft&&editingSleep)return;
  lastPull=Date.now();if(await pull())render();
});

/* ---------- Start ---------- */
async function boot(){
  lsLoad();render();
  if(!window.claude||!window.claude.use){loaded=true;setSync('Saved on this device only.');render();return}
  const [d,sa]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('sample').catch(()=>null)]);
  db=d;sample=sa;
  if(sample){try{const lim=await sample.limits();sampleImages=!!lim.images}catch(e){}}
  if(!db)setSync('Saved on this device only.');
  await pull();lastPull=Date.now();flushAll();loaded=true;
  const act=document.activeElement;if(!(act&&/INPUT|TEXTAREA/.test(act.tagName)))render();
}
boot();
</script>
</body></html>
